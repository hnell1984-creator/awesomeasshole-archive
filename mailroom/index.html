<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awesome Asshole — Private Mailroom</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">

<style>
:root{
  --bg:#111013;
  --card:#18161a;
  --ink:#e9e2eb;
  --muted:#9c939f;
  --line:#39313d;
  --purple:#b98bc9;
  --olive:#a7aa78;
  --orange:#d99058;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 15%,rgba(125,53,160,.14),transparent 38%),
    var(--bg);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
}

.card{
  width:min(560px,100%);
  padding:52px 42px 40px;
  background:linear-gradient(145deg,#18161a,#1d1a20);
  border:1px solid var(--line);
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.mark{
  width:82px;
  height:82px;
  object-fit:contain;
  margin-bottom:24px;
}

.eyebrow{
  margin:0 0 12px;
  color:var(--purple);
  font:700 10px/1.3 Arial,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
}

h1{
  margin:0;
  font:400 clamp(38px,8vw,62px)/.95 Arial,sans-serif;
  letter-spacing:-3px;
  text-transform:uppercase;
}

h1 span{
  color:var(--purple);
}

.subtitle{
  margin:22px 0 32px;
  color:var(--muted);
  font-size:16px;
}

.rule{
  width:70px;
  height:1px;
  margin:0 auto 28px;
  background:var(--olive);
}

.organisation{
  margin:0 0 30px;
  color:var(--olive);
  font:700 10px/1.5 Arial,sans-serif;
  letter-spacing:1.7px;
  text-transform:uppercase;
}

.enter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  min-height:48px;
  padding:0 24px;
  color:#e9e2eb;
  background:rgba(125,53,160,.12);
  border:1px solid #685570;
  border-radius:6px;
  text-decoration:none;
  font:700 10px/1 Arial,sans-serif;
  letter-spacing:1.8px;
  text-transform:uppercase;
  transition:.15s ease;
}

.enter:hover{
  background:rgba(125,53,160,.22);
  border-color:var(--purple);
}

.enter span{
  color:var(--purple);
  font-size:16px;
}

.footer{
  margin-top:36px;
  padding-top:18px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font:9px/1.5 Arial,sans-serif;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

@media(max-width:600px){
  .card{padding:42px 24px 32px}
}
</style>
</head>

<body>
<main class="card">

  <img class="mark" src="../assets/aa-logo.png"
       alt="Awesome Asshole">

  <p class="eyebrow">Awesome Asshole / Private Mailroom</p>

  <h1>PRIVATE<br><span>MAILROOM</span></h1>

  <p class="subtitle">
    Official correspondence for matters of
    questionable importance.
  </p>

  <div class="rule"></div>

  <p class="organisation">
    DÖHNEHEIM &amp; HENDASMERE
  </p>

  <a class="enter"
     href="https://webmail.awesomeasshole.co.za/">
    ENTER MAILROOM <span>→</span>
  </a>

  <div class="footer">
    Authorised personnel only<br>
    Private Archive Administration
  </div>

</main>
</body>
</html>
