
<script>
const archiveList = document.getElementById("archiveList");

async function loadArchives() {
  try {
    const response = await fetch("../archives.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Unable to load archives.json");
    }

    const records = await response.json();
    records.sort((a, b) => Number(a.sort) - Number(b.sort));
    archiveList.innerHTML = "";

    for (const record of records) {
      const link = document.createElement("a");
      link.className = "archive-entry";
      link.href = `./${record.folder}/`;

      const numberClass = record.folder.startsWith("interlude-")
        ? "archive-number interlude-number"
        : "archive-number";

      link.innerHTML = `
        <div class="${numberClass}">${record.number}</div>
        <div class="archive-details">
          <div class="archive-title">${record.title}</div>
          <div class="archive-kicker">${record.kicker}</div>
        </div>
        <div class="archive-status">
          <span>●</span> ${record.status}
        </div>
      `;

      archiveList.appendChild(link);
    }

    if (!records.length) {
      archiveList.innerHTML = `
        <p class="archive-loading">No archive records currently available.</p>
      `;
    }
  } catch (error) {
    console.error("Archive directory error:", error);
    archiveList.innerHTML = `
      <p class="archive-loading">Archive records are temporarily unavailable.</p>
    `;
  }
}

loadArchives();
</script>
