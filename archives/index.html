<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Awesome Asshole — Archive Directory</title>

<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/style.css">
</head>

<body>

<main class="shell">

  <section class="card archive-card">

    <header class="archive-header">
      <div>
        <p class="eyebrow">AWESOME ASSHOLE / PRIVATE ARCHIVE</p>
        <h1>ARCHIVE DIRECTORY</h1>
      </div>

      <a class="quiet" href="../">← FRONT DOOR</a>
    </header>

    <div class="rule"></div>

    <article class="memory">

      <p class="intro">
        DÖHNEHEIM &amp; HENDASMERE
      </p>

      <p class="tagline">
        A catalogue of stories worth keeping.
      </p>

      <div class="archive-list" id="archiveList">

        <p class="archive-loading">
          Retrieving archive records...
        </p>

      </div>

    </article>

    <footer>
      SOME STORIES ARE WORTH KEEPING.
    </footer>

  </section>

</main>

<script>
const archiveList = document.getElementById("archiveList");

const records = [
  {
    folder: "01",
    number: "01",
    title: "THE ADVERTISING PITCH",
    kicker: "BEFORE WE EVER MET",
    status: "FROZEN"
  },
  {
    folder: "02",
    number: "02",
    title: "THE BIRTHPLACE OF ASSHOLE",
    kicker: "11 JULY 2026",
    status: "OPEN"
  },
  {
    folder: "interlude-01",
    number: "INTERLUDE 01",
    title: "TWO MONKEYS",
    kicker: "BETWEEN THE BEATS",
    status: "OPEN"
  },
  {
    folder: "03",
    number: "03",
    title: "WHEN THE TROUBLE STARTED",
    kicker: "BIETJIE BANG. BIETJIE STOUT.",
    status: "OPEN"
  }
];

archiveList.innerHTML = "";

for (const record of records) {
  const link = document.createElement("a");
  link.className = "archive-entry";
  link.href = `./${record.folder}/`;

  const numberClass = record.folder.startsWith("interlude-")
    ? "archive-number interlude-number"
    : "archive-number";

  link.innerHTML = `
    <div class="${numberClass}">${record.number}</div>
    <div class="archive-details">
      <div class="archive-title">${record.title}</div>
      <div class="archive-kicker">${record.kicker}</div>
    </div>
    <div class="archive-status">
      <span>●</span> ${record.status}
    </div>
  `;

  archiveList.appendChild(link);
}
</script>
</body>
</html>
